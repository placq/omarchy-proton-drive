name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y dbus-x11 python3-dbus-next
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: OMARCHY_DRIVE_REQUIRE_DBUS_TEST=1 npm run validate
      - run: npm audit --omit=dev
